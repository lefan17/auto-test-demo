# Ruff 配置：代码检查和格式化。
# 装了 charliermarsh.ruff 扩展后，保存文件会自动按这里的规则格式化。
#
# 批次 2（traffic-replay）是自成一体的子项目：它自带 pytest.ini 与 conftest.py，
# 不参与根仓库的 marker 体系，也故意保持零耦合并入（不改它一行源码去迎合根 lint）。
# 它内部有一处 py312 专有语法（replay/model.py 的 `type JsonValue = ...`），
# 而本文件的 target-version 是 py310，一旦让根配置管到它就会立刻报 invalid-syntax。
# 因此整目录排除。这里必须用 extend-exclude 而不是 exclude：ruff 的 exclude 是**替换**默认排除表，
# 写成 exclude = ["traffic-replay"] 会把 .tox / .nox / .direnv / node_modules 等默认忽略目录一起顶掉，
# 而 .gitignore 并没有覆盖它们（实测 .tox 不在 .gitignore 里），于是 CI 的 `ruff check .` 会去读那些目录。
# extend-exclude 是**追加**，默认表原样保留，本次只多排除一个 traffic-replay，语义完全等价。
# force-exclude 让 pre-commit 那种「显式传文件名」的调用形式也一并跳过它。
extend-exclude = ["traffic-replay"]
force-exclude = true

line-length = 120
target-version = "py310"

[lint]
select = [
    "E",   # pycodestyle 错误
    "W",   # pycodestyle 警告
    "F",   # pyflakes：未使用变量/未定义名称
    "I",   # isort：import 排序
    "B",   # bugbear：常见隐藏 bug
    "PT",  # flake8-pytest-style：pytest 写法规范
]
ignore = [
    "E501",  # 行太长由 formatter 处理，不报错
    "B008",  # fixture 里调用函数是正常写法
]

[lint.per-file-ignores]
# conftest 里 fixture 的参数看起来"未使用"，其实是 pytest 的依赖注入，不能删
"**/conftest.py" = ["F811", "PT004"]

[lint.flake8-pytest-style]
# 多参数参数化统一写成元组 ("a", "b")，而不是 "a, b"。
# 两种写法 pytest 都支持，但元组能被编辑器补全和静态检查理解，
# 少一个参数时是「收集期报错」而不是「运行时才炸」。
# 不写这一项的话默认就是 tuple，这里写出来是为了让这个约定在配置里可见。
parametrize-names-type = "tuple"

[format]
quote-style = "double"
indent-style = "space"
