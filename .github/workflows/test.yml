name: Auto Test

# 触发时机：推送 / PR / 手动点按钮 / 每周夜间回归
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

  # 定时回归：每周一 UTC 18:00（北京时间周二凌晨 02:00）。
  # 为什么需要它——push/PR 触发只能发现"这次改动弄坏了什么"，
  # 发现不了**时间带来的腐烂**：某个依赖发了新版、公网站点改了响应、
  # GitHub runner 镜像换了 Python 补丁版本、Allure 的 npm 包发了破坏性更新。
  # 没有定时跑，这类问题会在某次无关的 PR 上突然爆出来，然后被当成"那个 PR 的锅"。
  # 排在周一凌晨（UTC 18:00 是北京时间周二 02:00）：在工作日开始前拿到结果，
  # 且跑的是**没人在改代码**的时间点——失败了不会和某次提交混淆。
  schedule:
    - cron: "0 18 * * 1"

# 同一分支的重复触发只保留最新的一个，取消排队中的旧任务。
# 场景：连续推 3 个提交修同一处，前两次的流水线已经没有意义了——
# 让它们继续跑既占 runner 名额，又会在 Actions 页面刷出一片过期的红叉。
# 注意：只有 pull_request 事件取消旧的，main 分支上的 push 必须全部跑完——
# 每次合并到 main 都可能引入问题，漏掉任何一次都是"没测过就进主干"。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 代码规范：仓库里早有 ruff.toml（line-length / target-version / select 都写好了），
  # 但在这次改动之前没有任何地方真的执行它——规矩只写在纸上。
  # 单独开一个 job 而不是塞进 test job：规范检查几秒钟就出结果，
  # 没必要等 playwright 装浏览器、等 api 用例跑完才告诉你 import 顺序错了。
  lint:
    runs-on: ubuntu-latest
    # 上限 10 分钟：lint 正常 20 秒内跑完，10 分钟还没结束一定是卡在
    # pip 下载或 GitHub 服务异常上。没有上限的话一个卡死的 job 会占满
    # 默认的 360 分钟，把并发名额全部堵住。
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # 之前只有 test job 有 cache: pip，lint job 每次都在裸装 ruff。
          # pip 缓存是按 requirements/约束文件的内容算 key 的，
          # 这个 job 不装 requirements.txt，所以它缓存的是 ruff 那个 wheel——
          # 命中率不高但零成本，而且能省掉每次 ~15 秒的下载。
          cache: pip

      # 版本写死，不装 latest：ruff 的规则集和 format 输出会随版本变，
      # 浮动版本会让"本地绿、CI 红"变成随机事件。
      # 0.16.10 是本地把仓库刷干净时用的版本，CI 与本地保持一致。
      - name: 安装 ruff
        run: python -m pip install "ruff==0.16.10"

      # 配置全部来自仓库根的 ruff.toml，这里不重复传任何参数，
      # 避免 CI 和本地跑的规则悄悄分叉。
      - name: ruff check（lint 规则）
        run: ruff check .

      # --check 只报告不写入：CI 上格式化必须是"检查"，
      # 自动改文件会让流水线产出与提交内容不一致。
      - name: ruff format --check（格式规范）
        run: ruff format --check .

  # 静态类型检查：单独一个 job，与 lint 分开。
  # 理由与 lint 独立于 test 一样——mypy 比 ruff 慢（要读全仓 + 建缓存），
  # 但远快于装 Playwright 和跑下面这些用例。把它挂在 test job 里，
  # 一个类型标注错误要等两分钟才知道。
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # 注意这里要装**完整的 requirements.txt**，不能只装 mypy。
      # 原因：本仓库的 [tool.mypy] 开了 ignore_missing_imports（第三方库没有
      # py.typed 标记），但那不代表依赖装不装无所谓——mypy 对"已安装但无类型标注"
      # 和"根本没安装"的处理路径不同，只装 mypy 得到的结论与本地不一致，
      # 会变成"本地绿、CI 红"的经典事故。
      # 本地实测：装齐依赖后 `python -m mypy` → 0 errors（65 source files）。
      - name: 安装依赖（与 test job 同一份约束）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "mypy==2.4.0"

      # 配置全部来自 pyproject.toml 的 [tool.mypy]；
      # 检查范围（files）与已知技术债的逐模块登记也都在那里，这里不传参数。
      - name: mypy（静态类型检查）
        run: python -m mypy

  test:
    runs-on: ubuntu-latest
    # 上限 45 分钟。串行跑完四组用例 + 装 Playwright + 生成 Allure 报告，
    # 正常在 6-10 分钟。45 分钟既留足了公网接口重试的余量，
    # 又不会让一个真卡死的 job 占满默认的 360 分钟额度。
    timeout-minutes: 45

    # 角色口令与 UI 口令从 GitHub Secrets 注入。用例侧（apis/mes_api.py、
    # data/config.yaml 的 ${UI_PASSWORD}）与 Mock 后端的**种子口令**取的都是
    # common/secrets.py 这一个来源，所以只要在这里注入，两边同时生效——
    # 不会出现"种子入库 A、用例拿 B 登录"的诡异 401。
    #
    # 没配 secret 时 GitHub 求值成空串，而 common/secrets.py 的取值判据是
    # `if value:`，空串会回落到「本地 Mock 默认口令」——即**行为与不注入时完全一致**。
    # 这正是想要的降级：fork 的 PR 拿不到 secret，流水线照样跑得通。
    #
    # 刻意**不**注入 MOCK_TOKEN_TTL / TOKEN_REFRESH_MARGIN_SECONDS / MOCK_SECRET：
    # 令牌生命周期用例自己按实例传这几个值（testcases/mes/test_token_lifecycle.py），
    # 全局设置会让"令牌已过期"这类用例的前提失真（它们需要精确控制 TTL）。
    env:
      MES_PASSWORD_ADMIN: ${{ secrets.MES_PASSWORD_ADMIN }}
      MES_PASSWORD_PLANNER: ${{ secrets.MES_PASSWORD_PLANNER }}
      MES_PASSWORD_OPERATOR: ${{ secrets.MES_PASSWORD_OPERATOR }}
      MES_PASSWORD_OPERATOR2: ${{ secrets.MES_PASSWORD_OPERATOR2 }}
      MES_PASSWORD_QA: ${{ secrets.MES_PASSWORD_QA }}
      UI_PASSWORD: ${{ secrets.UI_PASSWORD }}
      UI_WRONG_PASSWORD: ${{ secrets.UI_WRONG_PASSWORD }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # Allure 命令行本身是个 Java 程序，需要 JRE 才能生成报告
      - name: 安装 JDK 17（Allure 命令行依赖）
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # 关掉 autocrlf：下面 `scripts/export_openapi.py --check` 比对的是**文件字节**，
      # 而导出侧恒写 LF（见 .gitattributes 的 `*.json text eol=lf`）。
      # runner 上若 core.autocrlf=true，checkout 会把 docs/openapi.json 转成 CRLF，
      # 于是 check 会把"行尾差异"误报成"契约漂移"，而真相是根本没漂移。
      - name: 固定行尾（契约漂移检测依赖字节一致）
        run: git config core.autocrlf false

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装 Playwright 浏览器
        run: playwright install chromium --with-deps

      # ---------------------------------------------------------------------
      # 关于 -n（pytest-xdist）的取舍——这是本文件里唯一一处"看起来不专业"的选择
      # ---------------------------------------------------------------------
      # 本机实测（Windows，`-m "not ui"` 选中 329 passed + 11 xfailed）：
      #   串行 61.68s / 62.18s / 56.21s   ← 三次
      #   -n 4 --dist loadfile  20.93s / 20.52s / 20.78s
      # 所以这一组**开** -n 4 --dist loadfile，约 2.9x 加速。
      #
      # 为什么选 loadfile 而不是默认的 load：
      # 改造前实测 `-m mes -n 4 --dist load` → **30 passed, 1 error, EXIT=1**，
      # 报错是 teardown 阶段 `testcases/mes/conftest.py` 的会话级数据隔离断言：
      #   AssertionError: 会话结束时数据没有回到基线
      #   available_milli 3270.000 -> 3268.000（-2.000）
      #   issued_milli       0.000 ->    2.000（+2.000）
      # 原因是 MES 的数据隔离基线（session 作用域）与收尾断言**按 worker 各算一份**，
      # 默认的 load 会把同一文件的用例拆到不同 worker，于是"A worker 的收尾快照"
      # 对上不了"B worker 造的脏数据"。这不是并发竞态，是分发策略与 fixture 作用域错配。
      # loadfile 按文件分发，一个文件整个落在同一个 worker，作用域闭合，因而干净。
      #
      # ⚠️ 如实登记：那个 1 error 在当前用例集下**复现不出来了**
      # （`-m mes -n 4 --dist load` 四次实测 54 passed / EXIT=0，13.34~16.57s；
      #  `testcases/mes/` 的数据隔离与并发相关文件相对改造前一个字节没改）。
      # 复现不出来不等于修好了，所以这一组仍然只开 loadfile，不改成 load。
      #
      # 而这个仓库里的并发用例（testcases/mes 的 `assert_requests_overlapped`）
      # 在 loadfile 下**实测不失真**：它断言的是同一进程内几个线程的请求时间区间
      # 交叠过（`testcases/mes/conftest.py` 的 threading.Barrier），
      # loadfile 不拆文件，这些线程仍在同一个进程里跑。
      # 加压验证：`-m mes -n 8 --dist loadfile` 连跑 3 次，54 passed 全绿
      # （17.88 / 17.98 / 18.03s），说明它扛得住调度争抢。
      #
      # ⚠️ 另一件必须登记的事：`-m api` 那一组里有 33 条打**公网**
      # （jsonplaceholder.typicode.com），会随机红——实测 4 轮里 3 轮撞上，
      # 单轮 1~5 条失败，失败原文是 `Response [502]` + Cloudflare 的
      # `typicode.com | 502: Bad gateway` 页面，偶发 429。
      #
      # ✅ 波 2 已处置（docs/wave2-flaky-handoff.md）：这 33 条挂了
      # `testcases/api/flaky_policy.py` 的 `NETWORK_FLAKY` ——
      #   pytest.mark.flaky(reruns=1, only_rerun=<6 条抖动指纹>)
      # 它们的 502/429/超时会被重跑一次吸收，且**只在**抖动指纹上重跑：
      # 契约断言（字段被改坏、schema 漂移）红了仍然当场硬失败，一次都不重跑。
      # 所以这一步的红现在重新可以被当作"代码或契约坏了"。
      # ⚠️ 重跑过的用例不会悄悄变绿：`-raR` 里的 R 让插件打印 rerun 摘要，
      # 根 conftest.py 另外把账本写进 `reports/flaky-governance.json`。
      # ---------------------------------------------------------------------

      # ---------------------------------------------------------------------
      # 契约驱动测试（波 1 新增）
      # ---------------------------------------------------------------------
      # 两步是**互不替代**的两件事，所以分成两步：
      #
      # 第一步是**漂移门禁**：`docs/openapi.json` 是 `mock_server` 那 29 个 operation
      # 的自动导出产物（`python scripts/export_openapi.py` 写、`--check` 只比对）。
      # 它绿的唯一含义是"入库的契约与代码同源"。没有这一步，spec 会慢慢腐烂成
      # 一份看起来权威、实际描述着半年前服务的文档——而基于它生成的一切用例
      # 都在测一个不存在的系统。这一步不需要起服务，所以排在前面（秒级）。
      #
      # 第二步是**属性驱动契约测试**：schemathesis 按 spec 生成请求，
      # 断言"响应符合 spec 声明"。它比手写用例更容易撞出边界——
      # 本仓库的 DEF-05（非有限十进制字面量让服务回 500）就是它扫出来的，
      # 那句 `{"qty": "INFINITY"}` 手写用例基本不可能想到。
      #
      # 为什么钉住样例数（CONTRACT_MAX_EXAMPLES=8）：schemathesis 的默认规模
      # 是按时间预算自适应的，CI 上机器快慢不同会得到不同的样例集，
      # 于是"这次绿、下次红"的抖动会变成常态。钉成固定值后，同一份代码
      # 每次生成的样例集相同，门禁才是可复现的。想跑大样本用 `CONTRACT_FULL=1`
      # （本地实测约 45 秒，是默认值的 4 倍）。
      #
      # ⚠️ 这一步**依赖 requirements.txt 里的 schemathesis**，它同时是
      # 本仓库第一条"第三方契约工具"依赖；升级 schemathesis 前先看
      # requirements.txt 里那段关于 OpenAPI 3.1 实验开关的注释。
      - name: 契约漂移检测（入库 spec 必须与代码同源）
        run: python scripts/export_openapi.py --check

      - name: 契约属性测试（schemathesis 按 spec 生成请求）
        run: python -m pytest -m contract -q --alluredir=allure-results
        env:
          CONTRACT_MAX_EXAMPLES: "8"

      - name: 运行接口自动化（含覆盖率门禁）
        # 这一组是 116 条用例（33 接口 + 54 MES + 29 登录，后两组的用例同时打了
        # api 标记）。契约那 224 条**不在这里**：它们要单独起本地服务、单独钉样例数，
        # 已经在上面那一步跑过了。
        # --cov= 后面跟空值是关掉自动生成的 HTML/XML 子报告，
        # 报告格式由 --cov-report=term 单独指定，避免往工作区里写垃圾。
        run: |
          pytest -m api -n 4 --dist loadfile \
            --cov=. --cov-report=term --cov-report= \
            --cov-fail-under=40 \
            --alluredir=allure-results
        env:
          # CI 网络比本地慢，阈值放宽，避免误报
          # （实测 GitHub runner 连 jsonplaceholder 常在 2-4 秒波动）
          MAX_RESPONSE_MS: "8000"

      # 覆盖率门禁的数字来源：本机实测这一条命令 → **78.87%**
      # （3985 statements / 842 miss，TOTAL 79%）。门禁取 40，留足余量。
      #
      # 为什么不贴着实测值设：这个数字里有相当一部分来自公网接口用例本身，
      # 在 runner 上会抖动；门禁的意义是"拦住覆盖率**退化**"，不是"卡住当前值"。
      # 设成贴着实测值，任何一次无害的重构都会让它变红，然后就会有人来调低它——
      # 门禁一旦被调过一次，就不再有人相信它了。
      #
      # 注意：同一份代码全量跑（`-m "not ui" --cov=.`）是 **88.90%**
      # （4055/450），比这一组高出一截。差额来自契约那 224 条用例，
      # 它们在**上面那一步**就跑完了。门禁挂在这一组而不是全量上，是因为
      # 全量要再跑一次契约（约 21 秒）才凑得出同一份覆盖数据，
      # 而门禁要拦的是"这一组用例还测不测得住"。
      #
      # ⚠️ 关于 `mock_server/*` 的覆盖率（波 2 · P1-3 已修，见 docs/wave2-coverage-handoff.md）：
      #
      #   1. 由 fixture 以子进程拉起的那个真 Mock 服务**已经被统计**。做法：
      #      testcases/mes/mock_server_ctl.py 经 scripts/service_launcher.py 启动服务，
      #      并在 stop() 里先发优雅信号（Windows: CTRL_BREAK_EVENT）再 terminate / kill，
      #      让服务进程能正常返回到 atexit —— coverage 的数据是在 atexit 落盘的。
      #      launcher 的作用是吸收 uvicorn 关闭时"把原信号重发给自己"的默认终止动作。
      #   2. 不再需要 `-m coverage run --parallel-mode`：pytest-cov 的 COV_CORE_*
      #      通道本来就覆盖子进程，分片（`.coveragerc` 的 `[run] parallel = true`）
      #      由 pytest-cov 在 session 结束时自动 combine，不用手工 combine。
      #   3. 实测对照（本机）：`-m mes --cov=mock_server` 由 9% 升到 **83%**
      #      （routers.py 0% → 84%、services.py 0% → 70%、deps.py 0% → 82%、app.py 0% → 90%）；
      #      `-m login --cov=login_app` 由 31% 升到 **85%**（run.py 0% → 100%）。
      #   4. 上一版注释写的"这一块的真实盲区没有被消掉"**已经不成立**：
      #      原结论是"子进程不记账"，而真相是"记账了但没落盘"（被强杀，跑不到 atexit）。

      # UI 用例打的是公共 demo 站，外部因素多，失败不阻断流水线。
      # 但这不等于可以放着不管：报告和截图照样产出，需要人去看。
      # UI 不并行：只有 2 个测试文件，`-n 4` 实际只会用上 2 个 worker，
      # 而启动 2 个 worker 进程 + 每个 worker 各自拉起一次 Chromium 的开销，
      # 大于它省下的用例时间；且浏览器并发会显著抬升公共 demo 站的失败率。
      - name: 运行 UI 自动化（失败不阻断流水线）
        run: pytest -m ui --alluredir=allure-results
        continue-on-error: true

      # 业务全链路用例：fixture 自己拉起本地 FastAPI + 独立 SQLite，
      # 不依赖外部网络，所以它反而是 CI 上最稳的一组。
      # 注意这一步**不设** continue-on-error：它测的是我们自己造的服务的状态机、
      # 乐观锁和金额精度，红了就是真坏了，必须拦住流水线。
      #
      # 这一组**刻意不开 -n**，尽管 `-m api` 那一步开过了。理由有两条，都有实测：
      # 1. 并行只快 1.26 倍，收益极小：本机三次实测
      #    `-m mes -n 4 --dist loadfile` 16.54 / 16.58 / 16.57s，
      #    串行 20.88 / 21.07 / 20.57s。只有 4 个测试文件，
      #    而每个 worker 都要付一次"造一个独立 SQLite + 起一个 mock_server 子进程"
      #    的启动成本，把能省的都吃掉了。
      #    （⚠️ 旧注释写的是"并行反而更慢 12.24s vs 8.67s"——那是改造前 30 条用例时
      #     的实测，现在用例涨到 54 条、串行涨到 20.8s，结论反过来了。数字已更正。）
      # 2. 这组用例里有**真实线程交叠**的竞态断言（`assert_requests_overlapped`，
      #    见 testcases/mes/concurrency.py），它靠 threading.Barrier 让请求同时在途。
      #    把机器塞满并行 worker 会拉长每个请求的墙钟，让交叠判据的边界变窄——
      #    实测在 loadfile 下仍绿（`-n 8` 连跑 3 次 54 passed，17.88~18.03s），
      #    但在它自己该守的那一步上，用 4 秒换一份不确定性，不划算。
      # 一句话：**能不省的地方就不省**——性能门禁和并发断言的价值全在于它说了实话。
      - name: 运行业务全链路自动化（本地 Mock 后端）
        run: pytest -m mes --alluredir=allure-results

      # 登录契约用例：fixture 自己拉起本地 login_app，同样不依赖外部网络。
      # 这组用例钉住的是被测服务的**当前行为**（含 6 个已知缺陷，见 login_app/app.py），
      # 所以它绿不代表"服务没问题"，而是代表"服务的行为没有变化"。
      # 一旦有人改了 login_app 却没同步用例、或者修好了缺陷，这一步会红——
      # 红的时候先看 docs/login-contract.md 的"契约 vs 实现"差异表，再决定是改用例还是改实现。
      # 不开 -n：只有 1 个测试文件，loadfile 模式下 n>1 完全用不上。
      - name: 运行登录契约自动化（本地被测服务）
        run: pytest -m login --alluredir=allure-results

      # 流量回放（批次 2）：它落在 traffic-replay/ 子目录里，**自成一个子项目**——
      # 自带 pytest.ini（testpaths = tests、addopts = -v -ra --strict-markers，marker 是
      # recorder / replay / analyze，与根 12 个 marker 零重叠）与自己的 conftest.py。
      # 根 pytest.ini 的 testpaths = testcases 收不到它，所以必须由这一步单独跑；实测 173 条。
      # 用 working-directory 而不是 cd：失败时 GitHub 会把出错行定位到这条 run 上，更好读。
      # 不设 continue-on-error：它是独立交付物，红了就是它自己坏了，必须拦住流水线。
      - name: 运行流量回放子项目自测（自带 pytest.ini，独立于根 marker 体系，失败即阻塞）
        working-directory: traffic-replay
        run: python -m pytest -q

      # qaplat 平台层自测：被测对象是**平台自己**——registry 的用例/operation 归属、
      # metrics_store 的落盘格式、gate_layers 的门禁分层、drift_report_cli 的命令行契约，
      # 实测 105 条（testcases/platform/ 下 4 个文件）。
      # 它必须独立成 step，理由与上面的 contract 那一步同理：这 105 条
      # **完全落在宿主层之外**——`-m "platform and (api or ui or mes or login or contract or perf)"`
      # 的收集数是 0，所以 `-m api` / `-m mes` / `-m login` 三步一条都跑不到它。
      # 没有这一步，这 105 条在 CI 上永远不会被执行（改前实测：本文件全文没有
      # `platform` 字样），平台层会静默腐烂——而门禁脚本 check_gate_policy.py 自己
      # 就住在 scripts/ 下、由 qaplat 平台层提供分层与归属判定，它坏了没人知道。
      # 不设 continue-on-error：平台层红了就是真坏了，必须拦住流水线。
      # 不开 -n：只有 4 个测试文件，worker 启动开销大于收益（与 mes / login 同理）。
      - name: 运行 qaplat 平台层自测（平台自身，独立于宿主层，失败即阻塞）
        run: pytest -m platform --alluredir=allure-results

      # ---------------------------------------------------------------------
      # 用例编号 → nodeid 的索引与禅道上报（波 3 · P2-1 新增）
      # ---------------------------------------------------------------------
      # 为什么要单独跑这两个：
      #
      # 1. `scripts/test_report_to_zentao_stub.py` 在 `scripts/` 下，
      #    而 pytest.ini 的 `testpaths = testcases` **不会**递归到它——
      #    不写这一步，这个测试就永远没人跑。它自带 stdlib 的桩 HTTP 服务，
      #    不需要真实禅道实例、不需要网络，只断言发出的请求形状对不对。
      # 2. `scripts/case_index.py --verify` 是**索引自身的门禁**：它扫描 testcases/
      #    抽出用例编号，再跑一次真实 `--collect-only` 去对 nodeid；只要有一条编号
      #    解析不到 nodeid 就以 **exit 3** 失败。加它的意义是拦住"用例被改名/挪走、
      #    编号却还留在文档里"这种静默腐烂——那时追溯链路会悄悄断掉，报告里看不出来。
      #
      # 两步都不设 continue-on-error：它们红了就是链路真的断了。
      # 也**不设 PYTHONPATH**：全仓收集数在设置了 pylibs 路径时会从 181 涨到 369
      # （pylibs 里 schemathesis/hypothesis 自带的 conftest 测试会被收集），
      # 索引是对着本仓的用例说话的，不该把别人的测试算进来。
      - name: 禅道上报脚本的桩服务测试
        run: python -m pytest scripts/test_report_to_zentao_stub.py -q

      - name: 用例编号索引自检（有一条编号解析不出 nodeid 就红）
        run: python scripts/case_index.py --verify

      # 重试与代理回退的 23 条离线断言（纯桩对象、不发真请求，秒级）。
      # 为什么必须补这一步：README 一直拿「23/23 通过」当质量证据引用，但在这之前
      # workflow 里**一次都没执行过**它——「写在文档里的规矩、CI 从不执行」和
      # 「没跑成当通过」是同一类假绿，只是它骗的是读文档的人。第 23 条钉的是
      # 代理回退判据那个曾经的缺陷，正是它必须被拦住的那种回归。
      # 它不设 PYTHONPATH（只用 requests + allure + 仓内 apis，裸跑就是绿的），
      # 也不设 continue-on-error：它是判定步骤，红了就是重试语义真的坏了。
      - name: 重试与代理回退离线自检（23 条断言）
        run: python tools/check_retry.py

      # ---------------------------------------------------------------------
      # flaky 治理账本（波 2 新增）
      # ---------------------------------------------------------------------
      # 这一步**故意不设 if: failure()**：抖动与隔离区在绿的时候也必须被看见，
      # 只在失败时统计等于"平时不记账、出事才翻账"。
      # 它也不设 continue-on-error —— `scripts/flaky_report.py` 只在账本读不到时
      # 返回 2，而账本由根 conftest.py 的 sessionfinish 钩子无条件写（即使有用例失败）。
      # 幂等：多跑几次 -m 分组会把同一用例的账目覆盖，不会重复累计。
      - name: flaky 治理摘要（重跑才通过 / 隔离区）
        if: always()
        run: python scripts/flaky_report.py --markdown >> "$GITHUB_STEP_SUMMARY"

      # 账本本身留档，供周报脚本消费（`--json` 就是它的消费格式）。
      # 注意：`reports/` 在 .gitignore 里，所以账本天然不入库，
      # 没有这一步它跑完就随 runner 一起没了。
      - name: 上传 flaky 治理账本
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-governance
          path: reports/flaky-governance.json
          if-no-files-found: warn
          retention-days: 14

      # 刻意**不**给隔离区单独加 `pytest -m quarantine` 的 step：
      # 隔离区当前 0 条用例，pytest 空跑返回 exit=5，GitHub Actions 会把它当失败，
      # 于是"没有隔离用例"这件好事会天天把流水线弄红。
      # 隔离区清单由上面那步 `flaky_report.py --markdown` 无条件打印，信息不会丢。

      # 这里原来用的是 simple-elf/allure-report-action@v1.9，
      # 它是个 Docker action，基础镜像 openjdk:8-jre-alpine 已被 Docker Hub 下架，
      # 报 "not found / failed to resolve source metadata"，导致整个 job 在第一步就失败，
      # 连测试都没跑到。改用官方 Allure 命令行，行为可控、不依赖第三方镜像。
      # 注意：这里**不用** `allure generate --clean`。
      # Allure 2.x 有 --clean，但 Allure 3.x 把它移除了，写了会直接报
      # "Unknown Syntax Error: Command not found"，一条报告都生成不出来。
      # 先 `rm -rf` 再 generate 是版本无关的写法：2.x / 3.x 都能跑，效果与 --clean 等价。
      # 这样本地（可能装的 2.x，也可能装的 3.x）和 CI 用同一条命令，不会出现
      # "本地能跑、CI 挂" 或反过来的情况。
      - name: 生成 Allure 报告
        if: always()
        run: |
          npm install -g allure-commandline --silent
          if [ -d allure-results ] && [ "$(ls -A allure-results)" ]; then
            rm -rf allure-report
            allure generate allure-results -o allure-report
          else
            echo "没有产生 allure-results，跳过报告生成"
          fi

      - name: 上传测试报告（可在 Actions 页面下载）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: warn
          retention-days: 14

      # 失败截图实际落在 testcases/ui/artifacts/（见 testcases/ui/conftest.py 的
      # pytest_runtest_makereport 钩子）。这里原来写的是 ui/artifacts/，
      # 路径不存在，截图从来没被上传过。
      - name: 上传失败截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: testcases/ui/artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: 写流水线摘要
        if: always()
        run: |
          {
            echo "## 自动化测试结果"
            echo ""
            echo "| 项目 | 结果 |"
            echo "|---|---|"
            echo "| 接口用例 | \`pytest -m api\`（-n 4 --dist loadfile，含覆盖率门禁 40%） |"
            echo "| 契约用例 | \`pytest -m contract\`（含漂移检测 \`export_openapi.py --check\`，样例数钉死 8） |"
            echo "| UI 用例 | \`pytest -m ui\`（失败不阻断） |"
            echo "| 业务全链路 | \`pytest -m mes\`（本地 Mock 后端，刻意串行） |"
            echo "| 登录契约 | \`pytest -m login\`（本地被测服务，钉住当前行为含 6 个已知缺陷） |"
            echo "| qaplat 平台层 | \`pytest -m platform\`（平台自身：registry 覆盖矩阵、metrics_store、gate_layers、报表 CLI） |"
            echo "| 流量回放 | \`traffic-replay\` 子项目（自带 pytest.ini，173 条，独立于根 marker 体系） |"
            echo "| 数据隔离 | \`data_isolation_check\`：会话结束时各表行数与库存合计必须回到基线 |"
            echo "| flaky 治理 | 只有显式标了 \`flaky\` 的 33 条会在指纹匹配时重跑 1 次（裸 \`@pytest.mark.flaky\` 全仓 0 处，无全局 \`--reruns\`；账本见 \`flaky-governance\` artifact） |"
            echo "| 报告 | 见下方 Artifacts 里的 \`allure-report\` |"
            echo "| 失败截图 | 见 \`ui-screenshots\` |"
            if [ -d allure-results ]; then
              echo ""
              echo "本次共产生 $(ls allure-results | grep -c 'result.json' || true) 条用例结果。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # 覆盖率数字单独写进摘要：门禁只给"过/不过"，
      # 而人想知道的是"比上次涨了还是跌了"。
      - name: 把覆盖率写进流水线摘要
        if: always()
        run: |
          if [ -f .coverage ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### 覆盖率" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            python -m coverage report --skip-covered --skip-empty >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> 门禁值 40%（本组实测 78.87%；全量 \`-m \"not ui\"\` 是 88.90%）。" >> "$GITHUB_STEP_SUMMARY"
            echo "> \`mock_server/*\` 的数字**已经包含**由 fixture 拉起的真服务子进程（波 2 · P1-3）。" >> "$GITHUB_STEP_SUMMARY"
            echo "> 服务经 scripts/service_launcher.py 启动并优雅退出，coverage 分片由 pytest-cov 自动 combine。" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ---------------------------------------------------------------------
      # 失败通知：**不需要任何 secret**
      # ---------------------------------------------------------------------
      # 方案一（默认，永远可用）：失败时把诊断信息写进 step summary。
      # 它不依赖任何凭据，也不会因为权限问题把流水线本身弄红。
      - name: 失败时写诊断摘要（无需 secret）
        if: failure()
        run: |
          {
            echo ""
            echo "---"
            echo "## ❌ 本次流水线失败"
            echo ""
            echo "| 字段 | 值 |"
            echo "|---|---|"
            echo "| 触发方式 | \`${{ github.event_name }}\` |"
            echo "| 分支 / 引用 | \`${{ github.ref }}\` |"
            echo "| 提交 | \`${{ github.sha }}\` |"
            echo "| 执行者 | \`${{ github.actor }}\` |"
            echo "| 运行链接 | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
            echo ""
            echo "排查顺序：先看本页上方哪个 step 变红，再看 Artifacts 里的 \`allure-report\`；"
            echo "UI 用例的失败截图在 \`ui-screenshots\`。"
          } >> "$GITHUB_STEP_SUMMARY"

      # 方案二：自动开 issue 跟踪。用内置的 GITHUB_TOKEN，不需要配 secret。
      # 只在 push 到 main 与定时回归时开——PR 来自 fork 时 token 是只读的，
      # 开 issue 必然 403，那种失败会盖住真正的测试失败。
      # 同一时间只保留一个未关闭的告警 issue（靠固定 label 去重），
      # 否则定时回归一旦连续几周红，issue 列表会被刷屏，然后没人再看。
      - name: 失败时自动开 issue（复用内置 GITHUB_TOKEN）
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'push')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LABEL="ci-failure"
          TITLE="CI 失败：${{ github.ref_name }}（${{ github.event_name }}）"
          BODY="流水线在 \`${{ github.sha }}\` 上失败。

          - 触发方式：\`${{ github.event_name }}\`
          - 分支：\`${{ github.ref_name }}\`
          - 执行者：\`${{ github.actor }}\`
          - 运行链接：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          排查顺序：先看该 run 里哪个 step 变红，再看 Artifacts 的 \`allure-report\`。"
          gh label create "$LABEL" --color B60205 --description "CI 失败自动告警" 2>/dev/null || true
          EXISTING=$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "$LABEL"
          fi

  # ---------------------------------------------------------------------------
  # 依赖安全扫描
  # ---------------------------------------------------------------------------
  # 为什么单独一个 job 而不是塞进 test：
  # 它需要联网查漏洞库，与"用例有没有通过"是两件不相干的事。
  # 混在一起会让"某个依赖刚披露了一个 CVE"表现为"测试失败"，误导排查方向。
  #
  # 为什么 continue-on-error（非阻塞）：
  # pip-audit 查的是**公共漏洞库的当前状态**，而不是这份代码的质量。
  # 今天全绿、明天可能因为某个传递依赖被披露了 CVE 而变红——
  # 那与本次提交毫无关系。把它设成阻塞，等于让"上游披露漏洞"变成
  # "任何人的 PR 都过不去"，最后一定是有人把它删掉。
  # 正确做法是让它红并**通知到人**，由人决定升级还是接受风险。
  #
  # 本机无法验证这一步：`pip-audit -r <file>` 与 pre-commit 都需要创建虚拟环境，
  # 而本机沙箱拒绝 ensurepip（PermissionError: [WinError 5]）。
  # 但 `pip-audit --local` 无需建 venv，本机可跑（实测报出 21 个已知漏洞 / 7 个包）。
  # 另一个已修的独立缺陷：`-r` 读含中文注释的 requirements*.txt 时，
  # 内嵌的 pip_requirements_parser 会回退到 cp936 而抛 UnicodeDecodeError；
  # 已通过给文件补 PEP263 首行声明修复。
  # 故本步骤（`-r requirements.lock`）**仅 CI 可验证**。
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # 版本写死，与 lint job 的 ruff 同理：不装 latest。
      # 未钉版本时，某天上游发新版就可能让这个 job 因为"工具本身的行为变了"而变色，
      # 而那一变化与本次提交毫无关系。
      # 2.10.1 是当前的 latest（PyPI JSON API 实测），也是 agent-test-hub 钉的同一版本。
      - name: 安装 pip-audit
        run: python -m pip install "pip-audit==2.10.1"

      # --strict：把"查不到但可能有问题"的情况也当成失败，避免静默跳过。
      # 扫 requirements.lock 而不是 requirements.txt：锁文件里是**实际会被安装的
      # 完整传递依赖树**（123 行），而 requirements.txt 只有 13 个直接依赖。
      # 绝大多数 CVE 出现在传递依赖上（urllib3 / certifi / anyio 之类），
      # 只扫直接依赖等于漏掉大半攻击面。
      - name: pip-audit（扫描锁定的依赖树）
        continue-on-error: true
        run: |
          if [ -f requirements.lock ]; then
            pip-audit --requirement requirements.lock --strict --desc on
          else
            pip-audit --requirement requirements.txt --strict --desc on
          fi

      - name: 把审计结果写进摘要
        if: always()
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 依赖安全扫描（pip-audit）" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "本步骤**非阻塞**：漏洞库每天都在变，它的红不代表本次提交有问题。" >> "$GITHUB_STEP_SUMMARY"
          echo "扫描对象是 \`requirements.lock\`（含传递依赖），不是 \`requirements.txt\`。" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # pre-commit：验证 .pre-commit-config.yaml 本身是可用的
  # ---------------------------------------------------------------------------
  # 为什么要在 CI 里再跑一遍 pre-commit：hook 配置是**会腐烂的代码**。
  # rev 指向的 tag 可能被删、hook id 可能被改、local hook 引用的脚本可能被改名。
  # 开发者的机器上装着 hook 也发现不了这些——因为 pre-commit 只在提交时
  # 才去拉那些 repo，而"提交时才发现 hook 拉不下来"的体验是：
  # 有人用 `--no-verify` 绕过，然后所有人都开始绕过。
  # 在 CI 上跑一次，把这类腐烂变成可见的红色。
  #
  # 本机无法验证：pre-commit 安装需要 ensurepip，沙箱拒绝（实测挂起 300s 无返回）。
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # 版本写死，理由同上（ruff / pip-audit 两处一致）。
      # 4.3.0 经 PyPI JSON API 实测存在且可安装；刻意**不**取当时的 latest 4.7.0：
      # 这个 job 是"验证 .pre-commit-config.yaml 没腐烂"，不是"追最新工具"，
      # 固定在一个已知可用的版本上，才能让红色只反映配置腐烂而不反映上游发版。
      - name: 安装 pre-commit
        run: python -m pip install "pre-commit==4.3.0"

      # 缓存 pre-commit 拉下来的 hook 环境。命中后这一步从 ~40 秒降到几秒。
      - name: 缓存 pre-commit 环境
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # --all-files 检查整个仓库（不是只查 diff）：
      # hook 是"新代码符合规范"，但仓库里可能本来就有不合规的旧文件；
      # 只查 diff 的话那些文件永远不会被修，规范就只约束了新代码。
      # commit-msg 阶段的 hook 在 --all-files 下会被自动跳过（没有提交信息可查），
      # 这是符合预期的，它由本地的 commit-msg hook 负责。
      - name: pre-commit run --all-files
        run: pre-commit run --all-files --show-diff-on-failure

      # 门禁策略的机器校验（波 3 新增）：docs/质量门禁策略.md 里逐条写明的
      # 「哪个 job 阻塞、哪一步放行、哪个 marker 归哪层」，必须与这份 workflow
      # 和 pytest.ini 说同一件事。策略文档从写下那天起就会开始腐烂——这一步
      # 让它腐烂的那一刻变成一次红灯，而不是半年后某人翻文档时的意外。
      # 纯标准库实现、只读文件，秒级；它只加严，不放宽任何已有门禁。
      - name: 校验门禁策略与 workflow 一致
        run: python scripts/check_gate_policy.py

  # ---------------------------------------------------------------------------
  # 提交信息规范：仓库的历史提交本身就要过关
  # ---------------------------------------------------------------------------
  # 为什么单独验证：.pre-commit-config.yaml 里的 commit-msg hook 只在**本地提交那一刻**
  # 触发，CI 上没有任何东西会执行 scripts/check_commit_msg.py。
  # 也就是说，如果这个脚本本身写错了（正则写错、把合法提交判红），
  # 它会变成一个"拦住所有人提交、但 CI 一片绿"的隐形故障。
  # 这里拿仓库最近 30 条真实提交跑一遍，等于给这个脚本做回归测试。
  commit-convention:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 需要历史提交才能校验，默认的浅克隆（depth 1）拿不到。
          fetch-depth: 30

      - name: 安装 Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 注意：已有的历史提交里可能有不带 scope 或 type 不在白名单的，
      # 脚本会判红——那正是它该做的事。但为了不让"历史遗留"永久堵住流水线，
      # 这里逐条报告、不聚合失败：给出统计，由人决定要不要回头修历史。
      # 真正的强制点仍然在本地 hook（那是提交发生的地方）。
      - name: 校验最近 30 条提交信息
        run: |
          set -uo pipefail
          ok=0
          bad=0
          while IFS= read -r sha; do
            msg=$(git log -1 --pretty=%B "$sha")
            if printf '%s' "$msg" | python scripts/check_commit_msg.py - >/dev/null 2>&1; then
              ok=$((ok + 1))
            else
              bad=$((bad + 1))
              echo "::warning title=提交信息不合规::${sha:0:8} $(git log -1 --pretty=%s "$sha")"
            fi
          done < <(git log -n 30 --pretty=%H)
          echo "合规 $ok 条 / 不合规 $bad 条" >> "$GITHUB_STEP_SUMMARY"
          echo "合规 $ok 条 / 不合规 $bad 条"

  # 容量压测（波 3）。为什么它必须是非阻塞、且 push/PR 不触发：
  # 一批 4 梯度 × 2 次 × 20s 要 ~200 秒，而且数字天然带 10% 量级的批次间噪声
  # （见 docs/wave3-load-handoff.md 的重复性一节）——拿它当 PR 门禁，等于给每个
  # PR 加一个"随机红灯"，最后一定被人加 continue-on-error 或者直接删掉。
  # 结论要人看：所以只在手动点按钮和周一夜间跑，结果传 artifact，红了自己判断。
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # locust 故意不在 requirements.txt 里：它是压测工具而不是测试依赖，
      # 会拖进 gevent 并 monkey-patch 标准库（理由见 requirements-perf.txt 文件头）。
      - name: 安装依赖
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-perf.txt

      - name: 容量压测（4 梯度 × 2 次 × 20s）
        run: python perf/run_load.py --users "5,10,20,50" --run-time 20s --repeat 2 --label ci

      # 压测的产出是给人读的容量结论，不是通过/失败信号。
      # 报告里最该看的两处：Aggregated 行与 knee 判定（summary.json）。
      - name: 上传压测结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: reports/perf/
          if-no-files-found: warn
          retention-days: 14

      - name: 容量结论摘要
        if: always()
        run: |
          set -uo pipefail
          latest=$(ls -1d reports/perf/*/ 2>/dev/null | tail -n 1 || true)
          if [ -z "$latest" ]; then
            echo "没有产出结果目录" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### 容量压测 $latest"
            echo '```json'
            python -c "import json,sys; print(json.dumps(json.load(open(sys.argv[1], encoding='utf-8'))['knee'], ensure_ascii=False, indent=2))" "${latest}summary.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 在线报表（GitHub Pages）
  # ---------------------------------------------------------------------------
  # 为什么单独一个 job：它既不测代码也不产出测试结论，只把 qaplat 平台层的
  # HTML 报表发布到 gh-pages 分支。混进 test job 会让"报表没发出去"表现为
  # "测试失败"，而这两件事的排查方向完全不同。
  #
  # 为什么 job 级 continue-on-error（非阻塞）：它只决定"在线报表更新没更新"，
  # 与这份代码能不能合并无关。发布依赖的是外部状态（gh-pages 分支、Pages 服务、
  # token 的 contents: write 权限），让这些获得把整条流水线弄红的权力，
  # 最后一定是有人把它删掉。
  #
  # 为什么报表在 CI 里现场生成而不是提交进仓库：qaplat/.cache/ 的语义是
  # "本机跑过什么"的历史状态（见 .gitignore 里的注释），属于过程产物，
  # 不进 main 的历史。CI 上是一份全新检出，没有这个目录，所以这里现跑
  # registry build → drift record → report 三步生成报表目录，再整目录发布。
  #
  # 为什么发布用 force push：每次都在临时目录里 git init 一个只含这一份
  # 报表快照的新仓库，再 force push 到 gh-pages。重复跑不会冲突，也不会把
  # gh-pages 堆成一长串"更新报表"的提交——它只承载产物，不需要保留历史。
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    # 仓库默认的 workflow 权限是只读，推 gh-pages 必须显式放开 contents: write。
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 生成 qaplat 报表
        run: |
          set -euo pipefail
          # 三步都走 qaplat 自己的 CLI：覆盖矩阵（含平台自测排除）、
          # 契约漂移检查、静态 HTML 报表。报表每页自包含，必须整目录发布，
          # 否则页面之间的导航会变成死链。
          python -m qaplat.cli registry build
          python -m qaplat.cli drift record --commit "${GITHUB_SHA::7}"
          python -m qaplat.cli report --out qaplat/.cache/report
          ls -l qaplat/.cache/report

      - name: 发布到 gh-pages
        id: publish
        # PR 上不发布：PR 的内容未必会进 main，往 gh-pages 推等于提前发布
        # 一个可能被否决的版本。push main / 手动 / 夜间三种触发源照常发布。
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          publish_dir="$(mktemp -d)"
          cp -r qaplat/.cache/report/. "$publish_dir"/
          cd "$publish_dir"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "docs: 更新 qaplat 在线报表（${GITHUB_SHA::7}）"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: 报表摘要
        if: always()
        run: |
          {
            echo "### 在线报表"
            echo ""
            if [ "${{ steps.publish.outcome }}" = "success" ]; then
              echo "已发布：https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
            elif [ "${{ steps.publish.outcome }}" = "skipped" ]; then
              echo "PR 上不发布（gh-pages 只由 push main、手动与夜间触发的运行更新）。"
            else
              echo "发布未成功（本 job 不阻塞流水线）：见上一步日志。"
            fi
            echo ""
            echo "| 页面 | 回答的问题 |"
            echo "|---|---|"
            echo "| \`index.html\` | 最近一轮、通过率、累计轮次、接口覆盖 |"
            echo "| \`runs.html\` | 最近几轮的状态 |"
            echo "| \`coverage.html\` | 哪些 operationId 还没有用例覆盖 |"
            echo "| \`attribution.html\` | 红灯里哪些是真回归、哪些是环境问题 |"
            echo "| \`drift.html\` | 契约基准有没有被悄悄改 |"
            echo ""
            echo "> \`runs.html\` 与 \`attribution.html\` 的内容来自 qaplat 度量库，"
            echo "> 而 CI 每次都是全新检出，所以没有轮次记录时它们显示空状态。"
            echo "> 轮次记录随 \`qaplat gate --layer <层>\` 的调用积累。"
          } >> "$GITHUB_STEP_SUMMARY"
