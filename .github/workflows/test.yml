name: Auto Test

# 触发时机：推送 / PR / 手动点按钮
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # 代码规范：仓库里早有 ruff.toml（line-length / target-version / select 都写好了），
  # 但在这次改动之前没有任何地方真的执行它——规矩只写在纸上。
  # 单独开一个 job 而不是塞进 test job：规范检查几秒钟就出结果，
  # 没必要等 playwright 装浏览器、等 api 用例跑完才告诉你 import 顺序错了。
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 版本写死，不装 latest：ruff 的规则集和 format 输出会随版本变，
      # 浮动版本会让"本地绿、CI 红"变成随机事件。
      # 0.16.10 是本地把仓库刷干净时用的版本，CI 与本地保持一致。
      - name: 安装 ruff
        run: python -m pip install "ruff==0.16.10"

      # 配置全部来自仓库根的 ruff.toml，这里不重复传任何参数，
      # 避免 CI 和本地跑的规则悄悄分叉。
      - name: ruff check（lint 规则）
        run: ruff check .

      # --check 只报告不写入：CI 上格式化必须是"检查"，
      # 自动改文件会让流水线产出与提交内容不一致。
      - name: ruff format --check（格式规范）
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Allure 命令行本身是个 Java 程序，需要 JRE 才能生成报告
      - name: 安装 JDK 17（Allure 命令行依赖）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装 Playwright 浏览器
        run: playwright install chromium --with-deps

      - name: 运行接口自动化
        run: pytest -m api --alluredir=allure-results
        env:
          # CI 网络比本地慢，阈值放宽，避免误报
          # （实测 GitHub runner 连 jsonplaceholder 常在 2-4 秒波动）
          MAX_RESPONSE_MS: "8000"

      # UI 用例打的是公共 demo 站，外部因素多，失败不阻断流水线。
      # 但这不等于可以放着不管：报告和截图照样产出，需要人去看。
      - name: 运行 UI 自动化（失败不阻断流水线）
        run: pytest -m ui --alluredir=allure-results
        continue-on-error: true

      # 业务全链路用例：fixture 自己拉起本地 FastAPI + 独立 SQLite，
      # 不依赖外部网络，所以它反而是 CI 上最稳的一组。
      # 注意这一步**不设** continue-on-error：它测的是我们自己造的服务的状态机、
      # 乐观锁和金额精度，红了就是真坏了，必须拦住流水线。
      - name: 运行业务全链路自动化（本地 Mock 后端）
        run: pytest -m mes --alluredir=allure-results

      # 登录契约用例：fixture 自己拉起本地 login_app，同样不依赖外部网络。
      # 这组用例钉住的是被测服务的**当前行为**（含 6 个已知缺陷，见 login_app/app.py），
      # 所以它绿不代表"服务没问题"，而是代表"服务的行为没有变化"。
      # 一旦有人改了 login_app 却没同步用例、或者修好了缺陷，这一步会红——
      # 红的时候先看 docs/login-contract.md 的"契约 vs 实现"差异表，再决定是改用例还是改实现。
      - name: 运行登录契约自动化（本地被测服务）
        run: pytest -m login --alluredir=allure-results

      # 这里原来用的是 simple-elf/allure-report-action@v1.9，
      # 它是个 Docker action，基础镜像 openjdk:8-jre-alpine 已被 Docker Hub 下架，
      # 报 "not found / failed to resolve source metadata"，导致整个 job 在第一步就失败，
      # 连测试都没跑到。改用官方 Allure 命令行，行为可控、不依赖第三方镜像。
      # 注意：这里**不用** `allure generate --clean`。
      # Allure 2.x 有 --clean，但 Allure 3.x 把它移除了，写了会直接报
      # "Unknown Syntax Error: Command not found"，一条报告都生成不出来。
      # 先 `rm -rf` 再 generate 是版本无关的写法：2.x / 3.x 都能跑，效果与 --clean 等价。
      # 这样本地（可能装的 2.x，也可能装的 3.x）和 CI 用同一条命令，不会出现
      # "本地能跑、CI 挂" 或反过来的情况。
      - name: 生成 Allure 报告
        if: always()
        run: |
          npm install -g allure-commandline --silent
          if [ -d allure-results ] && [ "$(ls -A allure-results)" ]; then
            rm -rf allure-report
            allure generate allure-results -o allure-report
          else
            echo "没有产生 allure-results，跳过报告生成"
          fi

      - name: 上传测试报告（可在 Actions 页面下载）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: warn
          retention-days: 14

      # 失败截图实际落在 testcases/ui/artifacts/（见 testcases/ui/conftest.py 的
      # pytest_runtest_makereport 钩子）。这里原来写的是 ui/artifacts/，
      # 路径不存在，截图从来没被上传过。
      - name: 上传失败截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: testcases/ui/artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: 写流水线摘要
        if: always()
        run: |
          {
            echo "## 自动化测试结果"
            echo ""
            echo "| 项目 | 结果 |"
            echo "|---|---|"
            echo "| 接口用例 | \`pytest -m api\` |"
            echo "| UI 用例 | \`pytest -m ui\`（失败不阻断） |"
            echo "| 业务全链路 | \`pytest -m mes\`（本地 Mock 后端） |"
            echo "| 登录契约 | \`pytest -m login\`（本地被测服务，钉住当前行为含 6 个已知缺陷） |"
            echo "| 数据隔离 | \`data_isolation_check\`：会话结束时各表行数与库存合计必须回到基线 |"
            echo "| 报告 | 见下方 Artifacts 里的 \`allure-report\` |"
            echo "| 失败截图 | 见 \`ui-screenshots\` |"
            if [ -d allure-results ]; then
              echo ""
              echo "本次共产生 $(ls allure-results | grep -c 'result.json' || true) 条用例结果。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
