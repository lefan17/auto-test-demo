[pytest]
# 用例文件与函数命名规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 默认参数：-v 详细输出 / -ra 汇总失败原因 / --strict-markers 拼错 marker 直接报错
# 末尾的 R 是给 pytest-rerunfailures 的：它只在 reportchars 里出现 r/R 时才打印
# "rerun test summary info" 一节。-ra 本身不含 R，所以没有它重跑在汇总里是隐形的。
# 注意这里**故意不写 --reruns**：全局重跑会连真回归一起吞掉（见 flaky marker 的说明）。
addopts = -v -raR --strict-markers
testpaths = testcases

# 自定义标记，用 -m 分组执行，例如: pytest -m api / pytest -m smoke
# 每个 marker 归哪一层、由哪个 CI step 跑、阻不阻塞、退出条件是什么，写在
# docs/质量门禁策略.md；那份文档与 .github/workflows/test.yml 由
# scripts/check_gate_policy.py 逐条机器校验——新增/改名 marker 必须同时改那份文档，
# 否则 CI 红。注意 smoke / regression / flaky 是横切标签，CI 里**没有**各自的 -m step：
# 它们标中的用例全部落在 api / mes / ui 三个宿主层里，跟着那三步一起跑。
markers =
    smoke: 冒烟用例，提交前必须通过
    regression: 回归用例，发版前跑
    api: 接口自动化用例
    ui: UI 自动化用例（需要浏览器，较慢）
    mes: MES Mock 业务用例（要起本地 FastAPI + SQLite，用 pytest -m mes 单独跑）
    login: 登录服务契约与缺陷探针用例（要起本地 FastAPI，无需公网）
    contract: 契约驱动用例（导出 spec 的漂移门禁 + schemathesis 属性测试，要起本地 FastAPI + SQLite）
    flaky: 允许重跑吸收抖动的用例。只对**显式标了它**的用例生效（裸 @pytest.mark.flaky 即 reruns=1），
        并且用 only_rerun 把重跑收窄到「第三方抖动」指纹——真回归不匹配指纹时会当场硬失败，
        一次都不重跑。绝不允许靠全局 --reruns 做 blanket rerun。
    quarantine: 隔离区。明知红/不稳定但暂不删除的用例：主门禁运行时被 deselect（不是判为通过），
        但清单会在终端摘要与 reports/flaky-governance.json 里逐条打印出来。
        单独运行：pytest -m quarantine。它的存在是为了让「红但不修」可见、可统计，
        而不是让用例库悄悄死亡。
    perf: 性能基线门禁用例（要起本地 mock_server 采样）。它同时也是 api 组的成员，
        所以 `pytest -m api` 会跑它；想只跑性能采样用 `pytest -m perf`（独占机器，数最干净）。
        重采基线：UPDATE_PERF_BASELINE=1 pytest -m perf

# 日志开关：失败时能看到请求日志
log_cli = false
log_cli_level = INFO
