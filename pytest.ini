[pytest]
# 用例文件与函数命名规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 默认参数：-v 详细输出 / -ra 汇总失败原因 / --strict-markers 拼错 marker 直接报错
addopts = -v -ra --strict-markers
testpaths = testcases

# 自定义标记，用 -m 分组执行，例如: pytest -m api / pytest -m smoke
markers =
    smoke: 冒烟用例，提交前必须通过
    regression: 回归用例，发版前跑
    api: 接口自动化用例
    ui: UI 自动化用例（需要浏览器，较慢）
    mes: MES Mock 业务用例（要起本地 FastAPI + SQLite，用 pytest -m mes 单独跑）

# 日志开关：失败时能看到请求日志
log_cli = false
log_cli_level = INFO
